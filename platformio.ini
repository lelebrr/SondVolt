; ============================================================================
; Sondvolt v4.0 - Cheap Yellow Display (ESP32-2432S028R)
; ============================================================================
; Mudancas importantes em relacao a configuracao anterior:
;
;   1. A flag -w foi REMOVIDA. Ela silenciava todos os avisos do compilador,
;      incluindo macros redefinidas com valores conflitantes e conversoes
;      perigosas. O codigo hoje compila limpo com -Wall -Wextra.
;
;   2. A plataforma esta com versao FIXA. Sem isso, o core do Arduino-ESP32
;      podia pular de 2.x para 3.x numa atualizacao qualquer e quebrar a API
;      do LEDC no meio do projeto. (O firmware suporta as duas atraves de
;      hal.cpp, mas a versao fixa torna o build reproduzivel.)
;
;   3. As bibliotecas tambem estao com versao fixa, pelo mesmo motivo.
; ============================================================================

[env:cyd]
platform      = espressif32 @ 6.5.0
board         = esp32dev
framework     = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed  = 921600

board_build.f_cpu      = 240000000L
board_build.f_flash    = 40000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv

build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-missing-field-initializers
    ; ---- Revisao de hardware montada ----
    ;   0 = Rev A (fiacao original, pinos compartilhados)
    ;   1 = Rev B (fiacao recomendada, sem compartilhamento)
    -DSONDVOLT_HW_REV=0
    ; ---- Verbosidade do log serial (0 desliga e economiza flash) ----
    -DSONDVOLT_VERBOSE=1
    ; ---- Configuracao da TFT_eSPI ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1     ; corrige o deslocamento de imagem da CYD
    -DTFT_ROTATION=3         ; paisagem
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=0
    -DTFT_BL=21
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DTOUCH_CS=33
    -DTOUCH_SCLK=25
    -DTOUCH_MOSI=32
    -DTOUCH_MISO=39
    ; ---- Fontes que o projeto realmente usa (as demais so ocupam flash) ----
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    greiman/SdFat @ ^2.2.3

; ----------------------------------------------------------------------------
; Ambiente alternativo para quem montou a placa na fiacao Rev B, sem os
; pinos compartilhados. Compile com:  pio run -e cyd-revb
; ----------------------------------------------------------------------------
[env:cyd-revb]
extends    = env:cyd
build_flags = ${env:cyd.build_flags}
    -USONDVOLT_HW_REV
    -DSONDVOLT_HW_REV=1

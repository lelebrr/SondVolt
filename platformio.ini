; ============================================================================
; Sondvolt v5.0 - Cheap Yellow Display (ESP32-2432S028R)
; ============================================================================
; Tres ambientes, um por revisao de hardware:
;
;   cyd        Rev A - fiacao original da CYD, com pinos compartilhados
;   cyd-revb   Rev B - fiacao limpa, OneWire e descarga em pinos proprios
;   cyd-revc   Rev C - Rev B + placa de expansao "Bancada" (osciloscopio,
;                      curva I-V, ripple, gerador, Zener, camera termica)
;
; Escolha o que corresponde ao que voce montou. Um firmware compilado para
; a Rev C roda na Rev A: os recursos que dependem da placa de expansao
; simplesmente se desativam sozinhos ao nao encontrar o hardware.
; ============================================================================

[platformio]
default_envs = cyd

; ----------------------------------------------------------------------------
; Base comum a todas as revisoes
; ----------------------------------------------------------------------------
[env]
platform      = espressif32 @ 6.5.0
board         = esp32dev
framework     = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

board_build.f_cpu      = 240000000L
board_build.f_flash    = 40000000L
board_build.flash_mode = dio
# Tabela propria com DOIS slots de aplicacao. A huge_app.csv que estava aqui
# tem um unico slot, e sem o segundo a atualizacao pela rede falha na hora de
# gravar. Veja o cabecalho de partitions_sondvolt.csv.
board_build.partitions = partitions_sondvolt.csv

; A flag -w foi removida na v4.0. Ela silenciava TODOS os avisos, incluindo
; macros redefinidas com valores conflitantes. O projeto compila limpo com
; -Wall -Wextra nas tres revisoes; se a sua alteracao gerar aviso, ele e real.
; O codigo esta organizado em camadas dentro de src/. O PlatformIO compila
; recursivamente, mas nao adiciona os subdiretorios ao caminho de include:
; sem estas linhas, #include "hal.h" nao seria encontrado.
build_flags =
    -Isrc
    -Isrc/hal
    -Isrc/domain
    -Isrc/services
    -Isrc/ui
    -Isrc/assets
    -Os
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-missing-field-initializers
    -DSONDVOLT_VERBOSE=1
    ; ---- TFT_eSPI ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1     ; corrige o deslocamento de imagem da CYD
    -DTFT_ROTATION=3
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=0
    -DTFT_BL=21
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DTOUCH_CS=33
    -DTOUCH_SCLK=25
    -DTOUCH_MOSI=32
    -DTOUCH_MISO=39
    ; Só as fontes que o projeto usa; as demais só ocupariam flash.
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    ; Sprite anti-flicker precisa de heap contigua.
    -DSMOOTH_FONT=0

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    greiman/SdFat @ ^2.2.3

; ============================================================================
; Rev A - fiacao original (padrao)
; ============================================================================
[env:cyd]
build_flags = ${env.build_flags}
    -DSONDVOLT_HW_REV=0

; ============================================================================
; Rev B - sem pinos compartilhados
; ============================================================================
[env:cyd-revb]
build_flags = ${env.build_flags}
    -DSONDVOLT_HW_REV=1

; ============================================================================
; Rev C - com a placa de expansao "Bancada"
; ============================================================================
; A biblioteca do MLX90640 so entra aqui: sao cerca de 30 KB de flash e 1,7 KB
; de RAM de coeficientes que nao fazem sentido carregar em quem nao tem a
; camera instalada.
[env:cyd-revc]
build_flags = ${env.build_flags}
    -DSONDVOLT_HW_REV=2

lib_deps = ${env.lib_deps}
    melopero/Melopero MLX90640 @ ^1.1.0

; ============================================================================
; Ambiente de depuracao
; ============================================================================
; Log serial completo e sem otimizacao agressiva, para quando algo estiver
; errado e voce precisar ver o que o firmware esta fazendo.
[env:cyd-debug]
build_type = debug
build_flags = ${env.build_flags}
    -DSONDVOLT_HW_REV=2
    -DCORE_DEBUG_LEVEL=4
    -Og
    -g3

lib_deps = ${env.lib_deps}
    melopero/Melopero MLX90640 @ ^1.1.0
